<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f9e63" />
    <meta name="description" content="FODMAP: Was darf auf den Teller – und was lieber nicht?" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>FODMAP Yumsy</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <input id="search" type="search" placeholder="Was möchtest du essen?" autocomplete="off" autocapitalize="none" enterkeyhint="search" />
      <nav class="tabs" role="tablist">
        <button id="tabList" role="tab" class="tab active" type="button">Liste</button>
        <button id="tabTodo" role="tab" class="tab" type="button">To-do <span id="todoCount" class="badge" hidden>0</span></button>
      </nav>
    </header>

    <div id="status" class="status" hidden></div>

    <section id="viewList">
      <label class="switch">
        <input id="showAdditional" type="checkbox" />
        <span>Auch Fertigprodukte &amp; Varianten zeigen</span>
      </label>
      <div id="notFound" class="notfound" hidden></div>
      <div id="accordions"></div>
      <p class="hint">Portion = Maximum pro Mahlzeit. Mehrere gelbe Lebensmittel in einer Mahlzeit können zusammen zu viel sein. Wort antippen = durchstreichen. „?“ = Wert unsicher.</p>
    </section>

    <section id="viewTodo" hidden>
      <form id="todoForm" class="todo-form">
        <input id="todoTerm" type="text" placeholder="Begriff zum Nachschlagen" autocomplete="off" required />
        <button type="submit" class="btn-add">+</button>
      </form>
      <ul id="todoList" class="todo-list"></ul>
      <p id="todoEmpty" class="hint" hidden>Nichts offen. 🎉</p>
    </section>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
